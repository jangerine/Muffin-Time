<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>머핀 타임 멀티플레이어</title>
  <style>
    body { font-family: sans-serif; background-color: #f7f9fc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .card-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .card { border: 2px solid #333; border-radius: 8px; padding: 10px; width: 120px; background: #fff3cd; text-align: center; }
    .trap { background: #f8d7da; }
    .action { background: #d1ecf1; }
    #log-box { height: 120px; border: 1px solid #ccc; overflow-y: scroll; padding: 5px; margin-top: 15px; background: #eee; }
    button { padding: 10px 15px; font-size: 16px; cursor: pointer; margin-right: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧁 머핀 타임 (Muffin Time)</h1>
    
    <!-- 로그인/입장 폼 -->
    <div id="login-sec">
      <input type="text" id="username" placeholder="닉네임 입력">
      <input type="text" id="room-id" placeholder="방 코드 (예: room1)" value="room1">
      <button onclick="joinGame()">게임 입장</button>
    </div>

    <!-- 게임 영역 -->
    <div id="game-sec" style="display:none;">
      <h3>현재 방: <span id="display-room"></span></h3>
      <h4>접속 플레이어:</h4>
      <ul id="player-list"></ul>

      <hr>
      <div>
        <button onclick="drawCard()">🃏 카드 1장 뽑기</button>
        <button onclick="shoutMuffinTime()" style="background-color: #ffc107;">🧁 머핀 타임 외치기!</button>
      </div>

      <h4>내 손에 든 카드 (<span id="hand-count">0</span>장):</h4>
      <div id="my-hand" class="card-list"></div>

      <h4>게임 진행 로그</h4>
      <div id="log-box"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
